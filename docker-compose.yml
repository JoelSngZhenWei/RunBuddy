services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: runbuddy-server:latest
    env_file:
      - server/.env # optional
    ports:
      - "8000:8000" # change left side if 8000 is busy, e.g. "8010:8000"
    # Dev hot reload:
    volumes:
      - ./server:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
  
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: runbuddy-client:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./client:/app # 🔥 Hot reload sync with local edits
      - /app/node_modules # Avoid overwriting node_modules
    depends_on:
      - server
    restart: unless-stopped
